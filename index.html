<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUB Global Alumni Chapter Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f4f4f4; }
        #map { width: 100vw; height: 100vh; }
        
        /* AUB Crimson Theme */
        .aub-popup h3 { color: #800000; margin: 0 0 4px 0; font-size: 16px; border-bottom: 2px solid #800000; padding-bottom: 4px; }
        .aub-popup p { font-size: 13px; margin: 4px 0; color: #333; }
        .aub-btn {
            display: block;
            margin-top: 6px;
            padding: 6px 10px;
            background-color: #800000;
            color: #fff !important;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            font-size: 12px;
        }
        .aub-btn-alt { background-color: #3b5998; } /* Facebook color */
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. Prevent Map Duplication & Infinte World Wrap
    const corner1 = L.latLng(-60, -180);
    const corner2 = L.latLng(85, 180);
    const bounds = L.latLngBounds(corner1, corner2);

    const map = L.map('map', {
        maxBounds: bounds,
        maxBoundsViscosity: 1.0, // Hard stop at map boundaries
        minZoom: 2,
        maxZoom: 10
    }).setView([25.0, 15.0], 2);

    // Clean Tile Layer with Tile Wrapping Disabled
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        noWrap: true,
        bounds: bounds,
        attribution: '&copy; American University of Beirut Alumni'
    }).addTo(map);

    // 2. Official WAAAUB Chapters Data
    const chapters = [
        // MENA Region
        { region: "MENA", country: "UAE", name: "Dubai & Northern Emirates Chapter", lat: 25.2048, lng: 55.2708, pres: "Roula Harb", aubUrl: "https://alumni.aub.edu.lb/s/1716/bp20/Interior.aspx?sid=1716&gid=2&pgid=527", email: "dubaichapter@waaaub.org" },
        { region: "MENA", country: "UAE", name: "Abu Dhabi Chapter", lat: 24.4539, lng: 54.3773, pres: "Suha Eid Takieddine", aubUrl: "https://alumni.aub.edu.lb/s/1716/bp20/Interior.aspx?sid=1716&gid=2&pgid=527", email: "abudhabichapter@waaaub.org" },
        { region: "MENA", country: "Jordan", name: "Club of Jordan Chapter", lat: 31.9454, lng: 35.9284, pres: "Haya Imam", aubUrl: "https://alumni.aub.edu.lb/s/1716/bp20/Interior.aspx?sid=1716&gid=2&pgid=527", email: "jordanchapter@waaaub.org" },
        { region: "MENA", country: "Bahrain", name: "Bahrain Chapter", lat: 26.0667, lng: 50.5577, pres: "Ashraf Obeid", aubUrl: "https://alumni.aub.edu.lb/s/1716/bp20/Interior.aspx?sid=1716&gid=2&pgid=527", email: "bahrainchapter@waaaub.org" },
        { region: "MENA", country: "Lebanon", name: "Central WAAAUB Campus Hub", lat: 33.8987, lng: 35.4800, pres: "WAAAUB Council", aubUrl: "https://alumni.aub.edu.lb/s/1716/bp20/Interior.aspx?sid=1716&gid=2&pgid=408", email: "alumni@aub.edu.lb" },

        // Europe Region
        { region: "Europe", country: "United Kingdom", name: "UK Chapter (London)", lat: 51.5074, lng: -0.1278, pres: "Chapter Executive Board", aubUrl: "https://alumni.aub.edu.lb/s/1716/bp20/Interior.aspx?sid=1716&gid=2&pgid=408", email: "ukchapter@waaaub.org" },
        { region: "Europe", country: "Greece", name: "Greece Chapter", lat: 37.9838, lng: 23.7275, pres: "Chapter Executive Board", aubUrl: "https://alumni.aub.edu.lb/s/1716/bp20/Interior.aspx?sid=1716&gid=2&pgid=408", email: "greecechapter@waaaub.org" },

        // North America Region
        { region: "North America", country: "USA", name: "New York Tri-State Chapter", lat: 40.7128, lng: -74.0060, pres: "Chapter Leadership", aubUrl: "https://alumni.aub.edu.lb/s/1716/bp20/Interior.aspx?sid=1716&gid=2&pgid=526", email: "nytristatechapter@waaaub.org" },
        { region: "North America", country: "USA", name: "Greater Washington DC Chapter", lat: 38.9072, lng: -77.0369, pres: "Chapter Leadership", aubUrl: "https://alumni.aub.edu.lb/s/1716/bp20/Interior.aspx?sid=1716&gid=2&pgid=526", email: "dcchapter@waaaub.org" },
        { region: "North America", country: "Canada", name: "Toronto Chapter", lat: 43.6532, lng: -79.3832, pres: "Chapter Leadership", aubUrl: "https://alumni.aub.edu.lb/s/1716/bp20/Interior.aspx?sid=1716&gid=2&pgid=526", email: "torontochapter@waaaub.org" }
    ];

    // 3. Render Interactive Pins with Direct AUB Links
    chapters.forEach(c => {
        const marker = L.marker([c.lat, c.lng]).addTo(map);
        marker.bindPopup(`
            <div class="aub-popup">
                <h3>${c.name}</h3>
                <p><strong>Region:</strong> ${c.region} (${c.country})</p>
                ${c.pres ? `<p><strong>President:</strong> ${c.pres}</p>` : ''}
                <p><strong>Contact:</strong> ${c.email}</p>
                <a href="${c.aubUrl}" target="_blank" class="aub-btn">View Official AUB Directory Page</a>
                <a href="mailto:${c.email}" class="aub-btn aub-btn-alt">Email Chapter Leadership</a>
            </div>
        `);
    });
</script>

</body>
</html>
