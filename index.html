<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAAAUB Global Chapters Map | AUB Alumni Connect</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; width: 100%; overflow: hidden; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #aad3df; }

        /* Top Header Bar with Logo */
        #header-bar {
            background-color: #ffffff;
            color: #333;
            padding: 8px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid #800000; /* AUB Crimson */
            z-index: 1000;
            position: relative;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .logo-container { display: flex; align-items: center; gap: 12px; }
        .logo-container img { height: 48px; width: auto; object-fit: contain; }

        .filter-container { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
        .filter-container label { font-size: 13px; font-weight: bold; color: #800000; }
        .filter-container select {
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #800000;
            font-size: 13px;
            font-weight: bold;
            color: #800000;
            cursor: pointer;
            background-color: #fff;
        }

        /* Map Canvas */
        #map { width: 100vw; height: calc(100vh - 66px); background-color: #aad3df; }

        /* Remove Ukrainian/Default Flag in Leaflet Footer */
        .leaflet-attribution-flag { display: none !important; }

        /* Custom Popup Styling */
        .aub-popup { padding: 4px; max-width: 270px; }
        .aub-popup h3 { color: #800000; font-size: 15px; margin-bottom: 6px; border-bottom: 2px solid #800000; padding-bottom: 4px; }
        .aub-popup p { font-size: 12px; color: #333; margin: 3px 0; }
        .rep-info { background: #f8f9fa; border-left: 3px solid #800000; padding: 6px 8px; margin: 8px 0; border-radius: 2px; }

        /* Social Icons Bar */
        .social-links { display: flex; gap: 6px; margin-top: 10px; }
        .social-btn {
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 7px 8px;
            color: white !important;
            text-decoration: none;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        .btn-insta { background-color: #E1306C; }
        .btn-fb { background-color: #1877F2; }
        .btn-portal { background-color: #800000; }
    </style>
</head>
<body>

<!-- Header Bar with Official Logo & Region Filter -->
<div id="header-bar">
    <div class="logo-container">
        <!-- Logo Image -->
        <img src="https://raw.githubusercontent.com/aub-alumni-connect/assets/main/aub_alumni_logo.jpg" alt="AUB Alumni Connect Logo" onerror="this.src='https://upload.wikimedia.org/wikipedia/en/2/29/American_University_of_Beirut_seal.png';">
    </div>
    <div class="filter-container">
        <label for="regionFilter"><i class="fa-solid fa-filter"></i> Filter Region:</label>
        <select id="regionFilter" onchange="filterChapters()">
            <option value="ALL">All Global Regions (60+ Chapters)</option>
            <option value="MENA">Middle East & North Africa (MENA)</option>
            <option value="North America">North America</option>
            <option value="Europe">Europe</option>
        </select>
    </div>
</div>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // 1. Strict Bounds & Zoom Controls to Prevent Gray Edges
    const southWest = L.latLng(-60, -180);
    const northEast = L.latLng(85, 180);
    const bounds = L.latLngBounds(southWest, northEast);

    const map = L.map('map', {
        maxBounds: bounds,
        maxBoundsViscosity: 1.0, // Prevents dragging beyond world map boundaries
        minZoom: 2.5,
        maxZoom: 10,
        worldCopyJump: false
    }).setView([25.0, 15.0], 2.5);

    // 2. English-First Carto Tile Layer (Clean & Full Screen)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        noWrap: true,
        bounds: bounds,
        subdomains: 'abcd',
        maxZoom: 19,
        attribution: '&copy; <a href="https://alumni.aub.edu.lb">American University of Beirut</a>'
    }).addTo(map);

    // 3. Official WAAAUB Chapters Dataset
    const chapters = [
        // MENA Region
        { 
            region: "MENA", 
            country: "Lebanon", 
            name: "Main Campus / Central WAAAUB", 
            lat: 33.8987, lng: 35.4800, 
            rep: "WAAAUB Council & Relations Office", 
            email: "alumni@aub.edu.lb", 
            insta: "https://www.instagram.com/aub_alumni", 
            fb: "https://www.facebook.com/AUBAlumniOfficial", 
            portal: "https://alumni.aub.edu.lb/s/1716/bp20/Interior.aspx?sid=1716&gid=2&pgid=408" 
        },
        { 
            region: "MENA", 
            country: "UAE", 
            name: "Dubai & Northern Emirates Chapter", 
            lat: 25.2048, lng: 55.2708, 
            rep: "Roula Harb (President)", 
            email: "dubaichapter@waaaub.org", 
            insta: "https://www.instagram.com/aub_alumni", 
            fb: "https://www.facebook.com/groups/2257287158/", 
            portal: "https://alumni.aub.edu.lb/s/1716/bp20/Interior.aspx?sid=1716&gid=2&pgid=527" 
        },
        { 
            region: "MENA", 
            country: "UAE", 
            name: "Abu Dhabi Chapter", 
            lat: 24.4539, lng: 54.3773, 
            rep: "Suha Eid Takieddine (President)", 
            email: "abudhabichapter@waaaub.org", 
            insta: "https://www.instagram.com/aub_alumni", 
            fb: "https://www.facebook.com/aub.alumni/", 
            portal: "https://alumni.aub.edu.lb/s/1716/bp20/Interior.aspx?sid=1716&gid=2&pgid=527" 
        },
        { 
            region: "MENA", 
            country: "Jordan", 
            name: "Club of Jordan Chapter", 
            lat: 31.9454, lng: 35.9284, 
            rep: "Haya Imam (President)", 
            email: "jordanchapter@waaaub.org", 
            insta: "https://www.instagram.com/aub_alumni", 
            fb: "https://www.facebook.com/AUBAlumniOfficial/", 
            portal: "https://alumni.aub.edu.lb/s/1716/bp20/Interior.aspx?sid=1716&gid=2&pgid=527" 
        },
        { 
            region: "MENA", 
            country: "Bahrain", 
            name: "Bahrain Chapter", 
            lat: 26.0667, lng: 50.5577, 
            rep: "Ashraf Obeid (President)", 
            email: "bahrainchapter@waaaub.org", 
            insta: "https://www.instagram.com/aub_alumni", 
            fb: "https://www.facebook.com/AUBAlumniOfficial", 
            portal: "https://alumni.aub.edu.lb/s/1716/bp20/Interior.aspx?sid=1716&gid=2&pgid=527" 
        },

        // Europe Region
        { 
            region: "Europe", 
            country: "United Kingdom", 
            name: "UK Chapter (London)", 
            lat: 51.5074, lng: -0.1278, 
            rep: "Executive Leadership Board", 
            email: "ukchapter@waaaub.org", 
            insta: "https://www.instagram.com/aub_alumni", 
            fb: "https://www.facebook.com/AUBAlumniOfficial/", 
            portal: "https://alumni.aub.edu.lb/s/1716/bp20/Interior.aspx?sid=1716&gid=2&pgid=408" 
        },
        { 
            region: "Europe", 
            country: "Greece", 
            name: "Greece Chapter", 
            lat: 37.9838, lng: 23.7275, 
            rep: "Chapter Executive Board", 
            email: "greecechapter@waaaub.org", 
            insta: "https://www.instagram.com/aub_alumni", 
            fb: "https://www.facebook.com/AUBAlumniOfficial", 
            portal: "https://alumni.aub.edu.lb/s/1716/bp20/Interior.aspx?sid=1716&gid=2&pgid=408" 
        },
        { 
            region: "Europe", 
            country: "Cyprus", 
            name: "AUB Mediterraneo Campus", 
            lat: 34.7754, lng: 32.4245, 
            rep: "AUB Mediterraneo Administration", 
            email: "alumni@aubmediterraneo.cy", 
            insta: "https://www.instagram.com/aubmediterraneo", 
            fb: "https://www.facebook.com/aubmediterraneo", 
            portal: "https://www.aubmediterraneo.cy" 
        },

        // North America Region
        { 
            region: "North America", 
            country: "USA", 
            name: "New York Tri-State Chapter", 
            lat: 40.7128, lng: -74.0060, 
            rep: "Chapter Leadership Board", 
            email: "nytristatechapter@waaaub.org", 
            insta: "https://www.instagram.com/aub_alumni", 
            fb: "https://www.facebook.com/AUBAlumniOfficial", 
            portal: "https://alumni.aub.edu.lb/s/1716/bp20/Interior.aspx?sid=1716&gid=2&pgid=526" 
        },
        { 
            region: "North America", 
            country: "USA", 
            name: "Greater Washington D.C. Chapter", 
            lat: 38.9072, lng: -77.0369, 
            rep: "Chapter Leadership", 
            email: "dcchapter@waaaub.org", 
            insta: "https://www.instagram.com/aub_alumni", 
            fb: "https://www.facebook.com/AUBAlumniOfficial", 
            portal: "https://alumni.aub.edu.lb/s/1716/bp20/Interior.aspx?sid=1716&gid=2&pgid=526" 
        },
        { 
            region: "North America", 
            country: "Canada", 
            name: "Toronto Chapter", 
            lat: 43.6532, lng: -79.3832, 
            rep: "Chapter Executive Board", 
            email: "torontochapter@waaaub.org", 
            insta: "https://www.instagram.com/aub_alumni", 
            fb: "https://www.facebook.com/AUBAlumniOfficial", 
            portal: "https://alumni.aub.edu.lb/s/1716/bp20/Interior.aspx?sid=1716&gid=2&pgid=526" 
        }
    ];

    let activeMarkers = [];

    // 4. Render Markers Function
    function displayChapters(filterRegion) {
        // Clear existing markers
        activeMarkers.forEach(m => map.removeLayer(m));
        activeMarkers = [];

        chapters.forEach(c => {
            if (filterRegion === "ALL" || c.region === filterRegion) {
                const marker = L.marker([c.lat, c.lng]).addTo(map);
                
                marker.bindPopup(`
                    <div class="aub-popup">
                        <h3>${c.name}</h3>
                        <p><strong>Country:</strong> ${c.country} (${c.region})</p>
                        <div class="rep-info">
                            <p><strong><i class="fa-solid fa-user-tie"></i> Leadership:</strong> ${c.rep}</p>
                            <p><strong><i class="fa-solid fa-envelope"></i> Email:</strong> ${c.email}</p>
                        </div>
                        <div class="social-links">
                            <a href="${c.insta}" target="_blank" class="social-btn btn-insta" title="Instagram"><i class="fa-brands fa-instagram"></i> Insta</a>
                            <a href="${c.fb}" target="_blank" class="social-btn btn-fb" title="Facebook Group"><i class="fa-brands fa-facebook"></i> Facebook</a>
                            <a href="${c.portal}" target="_blank" class="social-btn btn-portal" title="Official Directory"><i class="fa-solid fa-globe"></i> Directory</a>
                        </div>
                    </div>
                `);

                activeMarkers.push(marker);
            }
        });
    }

    // Initial Load
    displayChapters("ALL");

    // Filter Trigger
    function filterChapters() {
        const selectedRegion = document.getElementById("regionFilter").value;
        displayChapters(selectedRegion);
    }
</script>

</body>
</html>
